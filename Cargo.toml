[package]
name = "rugby-simulator"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
statrs = "0.16"
walkdir = "2.4"

[[bin]]
name = "rugby-simulator"
path = "src/main.rs"

[[bin]]
name = "train-model"
path = "src/bin/train.rs"

[lib]
name = "rugby_simulator"
path = "src/lib.rs"
