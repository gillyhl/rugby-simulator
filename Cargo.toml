[package]
name = "rugby-simulator"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack]
wasm-opt = false

[lib]
name = "rugby_simulator"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rugby-simulator"
path = "src/main.rs"

[[bin]]
name = "train-model"
path = "src/bin/train.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
statrs = "0.16"
walkdir = "2.4"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
